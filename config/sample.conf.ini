[remote]
host = <ip addres of the remote MYSQL server>
port = <exposed port of the mysql server>
user = <user account of MYSQL with CRUD rights over % host>
pw = <password matching the user account>
db = <name of the database you store the data in>

[local]
host = <localhost>
port = <port>
user = <user account with crud rights over this local host>
pw = <password matching hte user account>
db = <name of the database you store the data in>

[settings]
connection = <remote or local: remote is when your database is hosted on a different computer, local is where the mysql server is ont he same computer running the scraping scripts.>
image_directory = <root directory on the hard drive where you store the image files.>
vit_configurations = <relative path from root_dir to file where vit_configurations are saved. Use: config/vit_configs.json>

[directories]
root_dir = <Full path starting from filesystem root where you run the code from>
yolo_path = <relative path from root_dir where you have the YOLO model saved, if no model is present, it will be downloaded>
final_models_dirname = <name of the folder in your root_dir where you store the final model output. >
binary_dir = <relative path from root_dir where you store binary models generated ins tep 1.>
vit_dir = <relative path from root_dir where ViT models are stored. >
final_angle_dir = <set this to: angles >
brandphase = <set this to: brand >
angled = <set this to: angle_based >

